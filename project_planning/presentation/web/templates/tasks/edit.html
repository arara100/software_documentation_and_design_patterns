{% extends "base.html" %}

{% block title %}Редагувати: {{ task.name }}{% endblock %}

{% block breadcrumb %}
<nav aria-label="breadcrumb" class="mb-3">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{{ url_for('tasks.index') }}">Задачі</a></li>
    <li class="breadcrumb-item">
      <a href="{{ url_for('tasks.detail', task_id=task.id) }}">{{ task.name }}</a>
    </li>
    <li class="breadcrumb-item active">Редагувати</li>
  </ol>
</nav>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card p-4">
      <h4 class="fw-bold mb-4"><i class="bi bi-pencil me-2 text-primary"></i>Редагувати задачу</h4>
      <form method="post" id="taskForm">
        <div class="mb-3">
          <label class="form-label fw-semibold">Назва задачі</label>
          <input type="text" name="name" class="form-control" value="{{ task.name }}" required>
        </div>
        <div class="row mb-3">
          <div class="col">
            <label class="form-label fw-semibold">Тривалість (дні)</label>
            <input type="number" name="duration" class="form-control" value="{{ task.duration }}" min="1" required>
          </div>
          <div class="col">
            <label class="form-label fw-semibold">Статус</label>
            <select name="status" class="form-select">
              {% for s in statuses %}
              <option value="{{ s }}" {% if s == task.status %}selected{% endif %}>{{ s }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Тип задачі</label>
          <select name="task_type" class="form-select" id="taskTypeSelect">
            {% for t in task_types %}
            <option value="{{ t }}" {% if t == task.task_type %}selected{% endif %}>{{ t }}</option>
            {% endfor %}
          </select>
        </div>
        <div id="milestoneFields" class="mb-3 {% if task.task_type != 'milestone' %}d-none{% endif %}">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="is_critical" id="isCritical"
                   {% if task.is_critical %}checked{% endif %}>
            <label class="form-check-label" for="isCritical">Критична задача</label>
          </div>
        </div>
        <div id="depFields" class="mb-3 {% if task.task_type != 'dependency' %}d-none{% endif %}">
          <label class="form-label fw-semibold">Тип залежності</label>
          <select name="dependency_type" class="form-select">
            <option value="">— не вказано —</option>
            {% for dt in dep_types %}
            <option value="{{ dt }}" {% if dt == task.dependency_type %}selected{% endif %}>{{ dt }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-check-lg me-1"></i>Зберегти
          </button>
          <a href="{{ url_for('tasks.detail', task_id=task.id) }}" class="btn btn-outline-secondary">
            Скасувати
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const typeSelect = document.getElementById('taskTypeSelect');
  const milestoneFields = document.getElementById('milestoneFields');
  const depFields = document.getElementById('depFields');
  function updateFields() {
    milestoneFields.classList.toggle('d-none', typeSelect.value !== 'milestone');
    depFields.classList.toggle('d-none', typeSelect.value !== 'dependency');
  }
  typeSelect.addEventListener('change', updateFields);
</script>
{% endblock %}
