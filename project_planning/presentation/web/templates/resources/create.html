{% extends "base.html" %}

{% block title %}Новий ресурс{% endblock %}

{% block breadcrumb %}
<nav aria-label="breadcrumb" class="mb-3">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{{ url_for('resources.index') }}">Ресурси</a></li>
    <li class="breadcrumb-item active">Новий ресурс</li>
  </ol>
</nav>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h4 class="fw-bold mb-4"><i class="bi bi-plus-circle me-2 text-primary"></i>Новий ресурс</h4>
      <form method="post" id="resourceForm">
        <div class="mb-3">
          <label class="form-label fw-semibold">Назва <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Тип ресурсу <span class="text-danger">*</span></label>
          <div class="d-flex gap-3">
            {% for rt in resource_types %}
            <div class="form-check">
              <input class="form-check-input" type="radio" name="resource_type"
                     id="type_{{ rt }}" value="{{ rt }}"
                     {% if rt == 'human' %}checked{% endif %}>
              <label class="form-check-label" for="type_{{ rt }}">
                {% if rt == 'human' %}<i class="bi bi-person me-1"></i>Людський
                {% else %}<i class="bi bi-box me-1"></i>Матеріальний{% endif %}
              </label>
            </div>
            {% endfor %}
          </div>
        </div>

        <!-- Human fields -->
        <div id="humanFields">
          <div class="mb-3">
            <label class="form-label fw-semibold">Роль</label>
            <select name="role" class="form-select">
              <option value="">— оберіть роль —</option>
              {% for r in roles %}
              <option value="{{ r }}">{{ r }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Рівень навичок (1–10)</label>
            <input type="range" name="skill_level" class="form-range" min="1" max="10" value="5"
                   id="skillRange" oninput="document.getElementById('skillVal').textContent=this.value">
            <span class="text-muted" id="skillVal">5</span>
          </div>
        </div>

        <!-- Material fields -->
        <div id="materialFields" class="d-none">
          <div class="mb-3">
            <label class="form-label fw-semibold">Кількість</label>
            <input type="number" name="quantity" class="form-control" value="1" min="1">
          </div>
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-check-lg me-1"></i>Створити
          </button>
          <a href="{{ url_for('resources.index') }}" class="btn btn-outline-secondary">Скасувати</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.querySelectorAll('input[name="resource_type"]').forEach(el => {
    el.addEventListener('change', () => {
      const isHuman = el.value === 'human';
      document.getElementById('humanFields').classList.toggle('d-none', !isHuman);
      document.getElementById('materialFields').classList.toggle('d-none', isHuman);
    });
  });
</script>
{% endblock %}
