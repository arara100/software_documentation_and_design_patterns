{% extends "base.html" %}

{% block title %}Редагувати: {{ project.name }}{% endblock %}

{% block breadcrumb %}
<nav aria-label="breadcrumb" class="mb-3">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{{ url_for('projects.index') }}">Проекти</a></li>
    <li class="breadcrumb-item">
      <a href="{{ url_for('projects.detail', project_id=project.id) }}">{{ project.name }}</a>
    </li>
    <li class="breadcrumb-item active">Редагувати</li>
  </ol>
</nav>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h4 class="fw-bold mb-4"><i class="bi bi-pencil me-2 text-primary"></i>Редагувати проект</h4>
      <form method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold">Назва проекту</label>
          <input type="text" name="name" class="form-control" value="{{ project.name }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Дата початку</label>
          <input type="date" name="start_date" class="form-control" value="{{ project.start_date }}" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Дата завершення</label>
          <input type="date" name="end_date" class="form-control" value="{{ project.end_date }}" required>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-check-lg me-1"></i>Зберегти
          </button>
          <a href="{{ url_for('projects.detail', project_id=project.id) }}" class="btn btn-outline-secondary">
            Скасувати
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
