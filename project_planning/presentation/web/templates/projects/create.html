{% extends "base.html" %}

{% block title %}Новий проект{% endblock %}

{% block breadcrumb %}
<nav aria-label="breadcrumb" class="mb-3">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{{ url_for('projects.index') }}">Проекти</a></li>
    <li class="breadcrumb-item active">Новий проект</li>
  </ol>
</nav>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h4 class="fw-bold mb-4"><i class="bi bi-plus-circle me-2 text-primary"></i>Новий проект</h4>
      <form method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold">Назва проекту <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" placeholder="Наприклад: Платформа е-комерції"
                 required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Дата початку <span class="text-danger">*</span></label>
          <input type="date" name="start_date" class="form-control" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Дата завершення <span class="text-danger">*</span></label>
          <input type="date" name="end_date" class="form-control" required>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-check-lg me-1"></i>Створити
          </button>
          <a href="{{ url_for('projects.index') }}" class="btn btn-outline-secondary">Скасувати</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
